name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runs-on: [ ubuntu-latest ]
        node-version: [ 18, 20 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

  build:
    needs: test
    strategy:
      matrix:
        runs-on: [ ubuntu-latest ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: event-calendar-${{ matrix.runs-on }}
          path: .output/

  docker:
    needs: [ test, build ]
    strategy:
      matrix:
        runs-on: [ ubuntu-latest ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # - name: Build Docker image
      # uses: docker/build-push-action@v5
      # with:
      # context: .
      # platforms: linux/amd64,linux/arm64
      # push: false
      # tags: |
      # ${{ secrets.DOCKER_USERNAME }}/event-calendar:latest
      # ${{ secrets.DOCKER_USERNAME }}/event-calendar:${{ github.sha }}
      # cache-from: type=gha
      # cache-to: type=gha,mode=max

  deploy:
    needs: [ test, build ]
    strategy:
      matrix:
        runs-on: [ ubuntu-latest ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          # Add your deployment commands here
          # For example, using SSH to deploy to a server:
          # ssh user@server 'cd /app && ./scripts/deploy.sh'

      - name: Run health checks
        run: |
          echo "Running health checks..."
          # Add health check commands here
          curl -f https://vue-event-calendar.vercel.app/api/health
