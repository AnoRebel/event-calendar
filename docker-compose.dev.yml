# Development: hot-reloading dev server with the source bind-mounted.
#
#   docker compose -f docker-compose.dev.yml up
#
# The database is a libSQL file under ./.data (created and migrated on start).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "24678:24678" # Vite HMR
    environment:
      LIBSQL_URL: file:/app/.data/events.db
      NUXT_DEMO_ENABLED: ${NUXT_DEMO_ENABLED:-true}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.nuxt
