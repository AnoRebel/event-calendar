# Production: the app with an embedded, file-based libSQL database persisted on a
# named volume. Migrations run automatically on container start.
#
#   NUXT_APP_SECRET=$(openssl rand -base64 32) docker compose up -d
#
# To use a separate libSQL server instead of the embedded file, start the
# optional `sqld` service and point the app at it:
#
#   LIBSQL_URL=http://sqld:8080 docker compose --profile sqld up -d
services:
  app:
    image: event-calendar:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_UMAMI_SITE_ID: ${NUXT_UMAMI_SITE_ID:-}
        NUXT_RYBBIT_SITE_ID: ${NUXT_RYBBIT_SITE_ID:-}
        NUXT_PUBLIC_ENABLE_ANALYTICS: ${NUXT_PUBLIC_ENABLE_ANALYTICS:-false}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NUXT_APP_SECRET: ${NUXT_APP_SECRET:?Set NUXT_APP_SECRET (openssl rand -base64 32)}
      LIBSQL_URL: ${LIBSQL_URL:-file:/app/.data/events.db}
      LIBSQL_AUTH_TOKEN: ${LIBSQL_AUTH_TOKEN:-}
      NUXT_OPEN_REGISTRATION: ${NUXT_OPEN_REGISTRATION:-false}
      NUXT_DEMO_ENABLED: ${NUXT_DEMO_ENABLED:-false}
      NUXT_PUBLIC_FEATURES_RECURRING_EVENTS: ${NUXT_PUBLIC_FEATURES_RECURRING_EVENTS:-false}
      NUXT_PUBLIC_FEATURES_COLLABORATION: ${NUXT_PUBLIC_FEATURES_COLLABORATION:-false}
    volumes:
      - calendar-data:/app/.data
    restart: unless-stopped

  # Optional standalone libSQL server (Turso-compatible). Enable with --profile sqld.
  sqld:
    image: ghcr.io/tursodatabase/libsql-server:latest
    profiles: ["sqld"]
    volumes:
      - sqld-data:/var/lib/sqld
    restart: unless-stopped

volumes:
  calendar-data:
  sqld-data:
